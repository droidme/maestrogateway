name: CI & Docker Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (e.g. 1.0.0 or latest)"
        required: false
        default: "latest"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        run: mvn -B test

  docker-release:
    name: Build & Push Multi-Arch Docker Image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine Docker Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF_NAME#v}
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Multi-Arch Image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mvn -B compile jib:build \
            -Ddocker.image.name="${DOCKERHUB_USERNAME}/maestrogateway" \
            -Djib.to.tags="latest,${{ steps.meta.outputs.tag }}" \
            -Djib.to.auth.username="${DOCKERHUB_USERNAME}" \
            -Djib.to.auth.password="${DOCKERHUB_TOKEN}"
